<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#2f6690"/>
    </marker>
  </defs>
  <rect width="3840" height="2160" fill="#ffffff"/>

  <!-- Header -->
  <rect x="120" y="72" width="3600" height="238" rx="28"
        fill="#f7fbff" stroke="#c7ddec" stroke-width="3"/>
  <rect x="120" y="72" width="16" height="238" rx="8" fill="#173f5f"/>
  <text x="170" y="140" font-family="Noto Sans CJK SC, sans-serif"
        font-size="28" font-weight="700" fill="#2f6690" letter-spacing="4">
    2027 ROBOCON · BR VISION SYSTEM
  </text>
  <text x="170" y="214" font-family="Noto Sans CJK SC, sans-serif"
        font-size="58" font-weight="700" fill="#173f5f">
    003 绿色建塔区候选检测流程
  </text>
  <text x="170" y="270" font-family="Noto Sans CJK SC, sans-serif"
        font-size="27" fill="#486879">
    从真实图像到结构化候选；本阶段不包含四边形拟合、PnP 或释放决策
  </text>
  <rect x="3020" y="106" width="650" height="170" rx="20"
        fill="#edf7f2" stroke="#75b798" stroke-width="3"/>
  <text x="3345" y="158" text-anchor="middle"
        font-family="Noto Sans CJK SC, sans-serif"
        font-size="24" font-weight="700" fill="#2f6f4e">当前图集验证</text>
  <text x="3345" y="211" text-anchor="middle"
        font-family="Noto Sans CJK SC, sans-serif"
        font-size="43" font-weight="700" fill="#24613f">13 / 13 detected</text>
  <text x="3345" y="250" text-anchor="middle"
        font-family="Noto Sans CJK SC, sans-serif"
        font-size="21" fill="#426653">每张图 1 个接受候选</text>

  <!-- Pipeline frame -->
  <rect x="100" y="350" width="3640" height="570" rx="30"
