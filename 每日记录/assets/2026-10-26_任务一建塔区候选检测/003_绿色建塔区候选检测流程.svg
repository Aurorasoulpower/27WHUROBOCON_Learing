  <text x="3400" y="1340" font-family="Noto Sans CJK SC, sans-serif"
        font-size="21" fill="#486879">未实现</text>

  <text x="3080" y="1413" text-anchor="middle"
        font-family="Noto Sans CJK SC, sans-serif"
        font-size="34" fill="#c23b3b">≠</text>
  <rect x="2500" y="1448" width="1160" height="76" rx="16"
        fill="#f5f9fc" stroke="#c9ddea" stroke-width="2"/>
  <text x="2580" y="1498" font-family="Noto Sans CJK SC, sans-serif"
        font-size="25" font-weight="700" fill="#456579">相机位姿 / PnP</text>
  <text x="3400" y="1498" font-family="Noto Sans CJK SC, sans-serif"
        font-size="21" fill="#486879">未实现</text>

  <text x="3080" y="1571" text-anchor="middle"
        font-family="Noto Sans CJK SC, sans-serif"
        font-size="34" fill="#c23b3b">≠</text>
  <rect x="2500" y="1606" width="1160" height="76" rx="16"
        fill="#fff5f2" stroke="#dfb9b9" stroke-width="2"/>
  <text x="2580" y="1656" font-family="Noto Sans CJK SC, sans-serif"
        font-size="25" font-weight="700" fill="#8b2b2b">允许释放</text>
  <text x="3400" y="1656" font-family="Noto Sans CJK SC, sans-serif"
        font-size="21" fill="#8b4b4b">未实现</text>

  <!-- Footer -->
  <line x1="120" y1="1840" x2="3720" y2="1840" stroke="#d4e2eb" stroke-width="2"/>
  <text x="120" y="1905" font-family="Noto Sans CJK SC, sans-serif"
