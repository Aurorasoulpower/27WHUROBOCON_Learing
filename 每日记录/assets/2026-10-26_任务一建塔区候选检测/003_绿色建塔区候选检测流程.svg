  <rect x="1240" y="1540" width="54" height="28" rx="6" fill="#c23b3b"/>
  <text x="1310" y="1565" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#8b2b2b">R  拒绝</text>
  <text x="1720" y="1565" font-family="Noto Sans CJK SC, sans-serif"
        font-size="22" fill="#486879">详细原因：终端日志</text>
  <text x="210" y="1630" font-family="Noto Sans CJK SC, sans-serif"
