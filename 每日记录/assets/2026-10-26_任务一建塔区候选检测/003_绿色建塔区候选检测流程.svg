  <!-- Arrows -->
  <line x1="580" y1="605" x2="650" y2="605" stroke="#2f6690" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1080" y1="605" x2="1150" y2="605" stroke="#2f6690" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1580" y1="605" x2="1650" y2="605" stroke="#2f6690" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="2080" y1="605" x2="2150" y2="605" stroke="#2f6690" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="2580" y1="605" x2="2650" y2="605" stroke="#2f6690" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="3080" y1="605" x2="3150" y2="605" stroke="#2f6690" stroke-width="5" marker-end="url(#arrow)"/>

