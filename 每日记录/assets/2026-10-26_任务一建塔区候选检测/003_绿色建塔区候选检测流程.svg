  <rect x="3210" y="598" width="320" height="46" rx="12" fill="#f7fbf8"/>
  <text x="3370" y="630" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="22" font-weight="700" fill="#2f6f4e">detected</text>
  <rect x="3210" y="656" width="320" height="46" rx="12" fill="#f7fbf8"/>
  <text x="3370" y="688" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
