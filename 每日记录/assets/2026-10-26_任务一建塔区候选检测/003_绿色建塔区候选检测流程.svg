  <text x="1870" y="608" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">4096 图像约 21 px</text>
  <text x="1870" y="652" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">开运算 + 闭运算</text>
  <text x="1870" y="696" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">封闭孔洞填充</text>

  <!-- 05 -->
  <rect x="2160" y="450" width="420" height="310" rx="24"
        fill="#eef7fd" stroke="#7aaac8" stroke-width="3"/>
  <rect x="2160" y="450" width="420" height="62" rx="24" fill="#d9edf8"/>
  <text x="2370" y="490" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
