  <text x="2870" y="652" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">边界接触判断</text>
  <text x="2870" y="696" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">遮挡风险标记</text>

  <!-- 07 -->
  <rect x="3160" y="450" width="420" height="310" rx="24"
