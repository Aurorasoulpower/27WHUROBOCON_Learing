  <text x="1580" y="1350" font-family="Noto Sans CJK SC, sans-serif"
        font-size="21" fill="#8a6400">橙色：遮挡风险</text>

  <rect x="170" y="1430" width="2070" height="250" rx="20"
        fill="#f4f8fb" stroke="#c9ddea" stroke-width="2"/>
  <text x="210" y="1490" font-family="Noto Sans CJK SC, sans-serif"
        font-size="25" font-weight="700" fill="#173f5f">候选状态</text>
  <rect x="230" y="1540" width="54" height="28" rx="6" fill="#2f9e55"/>
