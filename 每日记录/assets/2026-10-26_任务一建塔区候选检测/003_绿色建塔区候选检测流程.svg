  <text x="1370" y="562" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="25" fill="#19384d">HSV 阈值候选</text>
  <text x="1370" y="608" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">H  35 – 90</text>
  <text x="1370" y="652" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">S  50 – 255</text>
  <text x="1370" y="696" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">V  60 – 255</text>

  <!-- 04 -->
  <rect x="1660" y="450" width="420" height="310" rx="24"
        fill="#eef7fd" stroke="#7aaac8" stroke-width="3"/>
  <rect x="1660" y="450" width="420" height="62" rx="24" fill="#d9edf8"/>
  <text x="1870" y="490" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="27" font-weight="700" fill="#173f5f">04  掩膜整理</text>
  <text x="1870" y="562" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
