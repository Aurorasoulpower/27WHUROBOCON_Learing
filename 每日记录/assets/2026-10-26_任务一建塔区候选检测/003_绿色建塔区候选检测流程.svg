  <text x="2400" y="1905" font-family="Noto Sans CJK SC, sans-serif"
        font-size="22" fill="#5a7484">验证：13 张静态实拍图</text>
  <text x="3320" y="1905" font-family="Noto Sans CJK SC, sans-serif"
