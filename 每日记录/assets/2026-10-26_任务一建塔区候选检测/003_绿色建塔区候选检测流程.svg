  <text x="140" y="402" font-family="Noto Sans CJK SC, sans-serif"
        font-size="27" font-weight="700" fill="#2f6690" letter-spacing="2">
    GREEN CANDIDATE PIPELINE
  </text>

  <!-- 01 -->
  <rect x="160" y="450" width="420" height="310" rx="24"
        fill="#eef7fd" stroke="#7aaac8" stroke-width="3"/>
  <rect x="160" y="450" width="420" height="62" rx="24" fill="#d9edf8"/>
  <text x="370" y="490" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="27" font-weight="700" fill="#173f5f">01  输入图像</text>
  <text x="370" y="562" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="25" fill="#19384d">实际场地照片</text>
  <text x="370" y="608" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">4096 × 3072</text>
  <text x="370" y="652" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="21" fill="#486879">L1 己方区 / 公共区</text>
  <text x="370" y="696" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="21" fill="#486879">测试图集 13 张</text>

  <!-- 02 -->
  <rect x="660" y="450" width="420" height="310" rx="24"
        fill="#eef7fd" stroke="#7aaac8" stroke-width="3"/>
  <rect x="660" y="450" width="420" height="62" rx="24" fill="#d9edf8"/>
  <text x="870" y="490" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="27" font-weight="700" fill="#173f5f">02  预处理</text>
  <text x="870" y="562" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="25" fill="#19384d">Gaussian 5 × 5</text>
  <text x="870" y="608" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">抑制像素噪声</text>
  <text x="870" y="652" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" fill="#486879">BGR → HSV</text>
  <text x="870" y="696" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="21" fill="#486879">不进行白平衡或调色</text>

  <!-- 03 -->
  <rect x="1160" y="450" width="420" height="310" rx="24"
        fill="#eef7fd" stroke="#7aaac8" stroke-width="3"/>
  <rect x="1160" y="450" width="420" height="62" rx="24" fill="#d9edf8"/>
  <text x="1370" y="490" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
